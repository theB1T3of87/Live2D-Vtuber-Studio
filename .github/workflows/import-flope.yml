name: Clone flope base
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-flope.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          path: destination
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Clone source repository
        run: |
          git clone --depth 1 https://github.com/theB1T3of87/flope.git source
      - name: Replace destination working tree
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github/workflows/***' \
            source/ destination/
      - name: Commit cloned source
        working-directory: destination
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Clone flope as project base"
            git push origin HEAD:main
          else
            echo "Destination already matches flope."
          fi
